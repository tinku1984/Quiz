<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Quiz results</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #F2F4F1; --surface: #FFFFFF; --ink: #172433; --muted: #586472; --line: #D3DAD4;
  --pencil: #1F4E8C; --pencil-soft: #E3ECF7; --bad: #B3261E; --bad-soft: #F8E3E1; --warn: #A6402A;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: light; box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #11161C; --surface: #19212A; --ink: #E5E9ED; --muted: #9AA6B2; --line: #2C3742;
    --pencil: #86B6EA; --pencil-soft: #1E3149; --bad: #F08F86; --bad-soft: #3A1D1B; --warn: #F0937B; color-scheme: dark; }
}
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--sans); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pencil); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 36px 20px 80px; }
h1 { font-size: 30px; font-weight: 600; margin: 0 0 6px; }
.sub { color: var(--muted); margin: 0 0 26px; }
.login { max-width: 420px; }
label { display: block; font-weight: 500; font-size: 15px; margin-bottom: 6px; }
input, select { padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); }
input:focus, select:focus { border-color: var(--pencil); outline: none; }
.login input { width: 100%; }
.btn { padding: 10px 18px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); }
.btn:disabled { opacity: .55; cursor: progress; }
.login .btn { margin-top: 14px; }
.msg { margin-top: 14px; padding: 10px 14px; border-radius: 8px; background: var(--bad-soft); color: var(--bad); }
.stats { display: flex; flex-wrap: wrap; gap: 10px 36px; margin: 0 0 24px; padding: 0; list-style: none; }
.stats b { display: block; font: 600 30px/1.1 var(--sans); font-variant-numeric: tabular-nums; }
.stats span { color: var(--muted); font-size: 14px; }
.state { display: inline-block; font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--pencil-soft); color: var(--pencil); margin-left: 8px; vertical-align: middle; }
.state.closed { background: var(--line); color: var(--muted); }
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 16px; }
.tools .grow { flex: 1; min-width: 200px; }
.tools .grow input { width: 100%; }
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: 15px; }
th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; font-size: 14px; color: var(--muted); position: sticky; top: 0; background: var(--surface); }
th button { all: unset; cursor: pointer; }
th button:focus-visible { outline: 3px solid var(--pencil); }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
th.num { text-align: right; }
td.enrol { font-family: var(--mono); font-size: 14px; }
td.late { color: var(--warn); font-weight: 600; }
tbody tr:last-child td { border-bottom: 0; }
.empty { padding: 40px 14px; text-align: center; color: var(--muted); }
.note { color: var(--muted); font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Quiz results <span class="state" id="state" hidden></span></h1>
  <p class="sub">Data Structure using C++ quiz</p>

  <form class="login" id="login">
    <label for="key">Results password</label>
    <input id="key" type="password" autocomplete="current-password" required>
    <p class="note">This is the admin_key value in the Settings tab of your Google Sheet.</p>
    <button class="btn" id="load" type="submit">Show results</button>
    <div class="msg" id="login-msg" role="alert" hidden></div>
  </form>

  <section id="panel" hidden>
    <ul class="stats" id="stats"></ul>
    <div class="tools">
      <div class="grow"><label for="q">Search</label><input id="q" type="search" placeholder="Enrollment number or name"></div>
      <div><label for="batch">Batch</label><select id="batch"><option value="">All batches</option></select></div>
      <button class="btn ghost" id="refresh" type="button">Refresh</button>
      <button class="btn ghost" id="csv" type="button">Download CSV</button>
      <button class="btn" id="xlsx" type="button">Download Excel</button>
    </div>
    <div class="scroll">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <p class="note">Downloads include the rows currently shown (after search and batch filter).</p>
  </section>
</div>

<script>
/* ===== Settings: paste the same Apps Script web app URL used in index.html ===== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbziqeFix9CmoqDFyFNwH7rrFQewDMBljYgfX_2xgSlH-OpobW4THfUOBci0EX9hPV09-A/exec";
/* =============================================================================== */

const $ = id => document.getElementById(id);
const COLS = [
  { key: "enrol", label: "Enrollment No", cls: "enrol" },
  { key: "name", label: "Name" },
  { key: "batch", label: "Batch" },
  { key: "marks", label: "Marks", cls: "num" },
  { key: "outOf", label: "Out of", cls: "num" },
  { key: "submittedAt", label: "Submitted at" },
  { key: "timeTaken", label: "Time taken" },
  { key: "onTime", label: "On time" },
];
let key = "", data = null, sortKey = "enrol", sortDir = 1;

async function fetchResults() {
  const res = await fetch(SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "results", key }) });
  return res.json();
}

$("login").addEventListener("submit", async e => {
  e.preventDefault();
  key = $("key").value.trim();
  const m = $("login-msg"); m.hidden = true;
  if (SCRIPT_URL.startsWith("PASTE")) { m.textContent = "Add your web app URL to SCRIPT_URL in results.html first."; m.hidden = false; return; }
  $("load").disabled = true; $("load").textContent = "Loading…";
  try {
    const r = await fetchResults();
    if (r.status !== "ok") { m.textContent = r.message || "Couldn't load results."; m.hidden = false; }
    else { data = r; $("login").hidden = true; $("panel").hidden = false; fillBatches(); draw(); }
  } catch (err) { m.textContent = "Couldn't reach the quiz server. Check the web app URL and your connection."; m.hidden = false; }
  $("load").disabled = false; $("load").textContent = "Show results";
});

$("refresh").addEventListener("click", async () => {
  $("refresh").disabled = true; $("refresh").textContent = "Refreshing…";
  try { const r = await fetchResults(); if (r.status === "ok") { data = r; fillBatches(); draw(); } } catch (e) {}
  $("refresh").disabled = false; $("refresh").textContent = "Refresh";
});

function fillBatches() {
  const sel = $("batch"), keep = sel.value;
  const batches = [...new Set(data.rows.map(r => r.batch))].sort();
  sel.innerHTML = "";
  const all = document.createElement("option"); all.value = ""; all.textContent = "All batches"; sel.append(all);
  batches.forEach(b => { const o = document.createElement("option"); o.value = b; o.textContent = b; sel.append(o); });
  sel.value = batches.includes(keep) ? keep : "";
}

function visibleRows() {
  const q = $("q").value.trim().toLowerCase(), b = $("batch").value;
  return data.rows
    .filter(r => (!b || r.batch === b) && (!q || r.enrol.toLowerCase().includes(q) || r.name.toLowerCase().includes(q)))
    .sort((a, c) => {
      const x = a[sortKey], y = c[sortKey];
      return (typeof x === "number" ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true })) * sortDir;
    });
}

function draw() {
  const st = $("state");
  st.hidden = false; st.textContent = data.open ? "Open" : "Closed"; st.classList.toggle("closed", !data.open);
  const rows = visibleRows();
  const avg = rows.length ? (rows.reduce((s, r) => s + r.marks, 0) / rows.length) : 0;
  const stats = [
    [data.rows.length, "submitted"],
    [Math.max(0, data.started - data.rows.length), "started, not yet submitted"],
    [rows.length ? avg.toFixed(1) : "–", rows.length && rows[0].outOf ? `average out of ${rows[0].outOf}` : "average"],
    [rows.length ? Math.max(...rows.map(r => r.marks)) : "–", "highest"],
  ];
  $("stats").innerHTML = "";
  stats.forEach(([n, l]) => { const li = document.createElement("li"); const b = document.createElement("b"); b.textContent = n; const s = document.createElement("span"); s.textContent = l; li.append(b, s); $("stats").append(li); });

  const head = $("head"); head.innerHTML = "";
  COLS.forEach(c => {
    const th = document.createElement("th"); if (c.cls === "num") th.className = "num";
    th.setAttribute("aria-sort", sortKey === c.key ? (sortDir > 0 ? "ascending" : "descending") : "none");
    const b = document.createElement("button");
    b.textContent = c.label + (sortKey === c.key ? (sortDir > 0 ? " ▲" : " ▼") : "");
    b.addEventListener("click", () => { if (sortKey === c.key) sortDir = -sortDir; else { sortKey = c.key; sortDir = c.key === "marks" ? -1 : 1; } draw(); });
    th.append(b); head.append(th);
  });

  const body = $("body"); body.innerHTML = "";
  if (!rows.length) {
    const tr = document.createElement("tr"); const td = document.createElement("td");
    td.colSpan = COLS.length; td.className = "empty";
    td.textContent = data.rows.length ? "No students match this search." : "No submissions yet. Results appear here as students submit.";
    tr.append(td); body.append(tr); return;
  }
  rows.forEach(r => {
    const tr = document.createElement("tr");
    COLS.forEach(c => {
      const td = document.createElement("td"); td.textContent = r[c.key];
      if (c.cls) td.className = c.cls;
      if (c.key === "onTime" && r.onTime === "No") td.className = "late";
      tr.append(td);
    });
    body.append(tr);
  });
}
$("q").addEventListener("input", draw);
$("batch").addEventListener("change", draw);

function table() { return [COLS.map(c => c.label), ...visibleRows().map(r => COLS.map(c => r[c.key]))]; }
function fileName(ext) { const b = $("batch").value; return `dsa-quiz-results${b ? "-" + b.replace(/[^\w-]+/g, "") : ""}.${ext}`; }

$("csv").addEventListener("click", () => {
  const csv = table().map(row => row.map(v => {
    let s = String(v ?? "");
    if (/^[=+\-@]/.test(s)) s = "'" + s;          // stop spreadsheet formula injection
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  }).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = fileName("csv"); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

$("xlsx").addEventListener("click", () => {
  if (typeof XLSX === "undefined") { alert("The Excel library didn't load. Use Download CSV instead."); return; }
  const ws = XLSX.utils.aoa_to_sheet(table());
  ws["!cols"] = [{ wch: 16 }, { wch: 28 }, { wch: 10 }, { wch: 7 }, { wch: 7 }, { wch: 20 }, { wch: 11 }, { wch: 8 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Results");
  XLSX.writeFile(wb, fileName("xlsx"));
});
</script>
</body>
</html>
